# Retornatus PR gates (opt-in)
#
# Copy into a consumer repo as `.github/workflows/retornatus.yml`
# (or merge steps into an existing workflow).
#
# Requires:
#   - Python 3.11+
#   - `.retornatus/` initialized in the repository
#   - `retornatus` on PyPI at the pin below
#
# Pin: this repository's current version. `gate scope`, `gate suppressions`,
# and blocking `verify` are in source after 1.3.0 was published. Bump the pin
# to the release that contains them before relying on this file in CI.
#
# RETORNATUS_OMISSION:
#   fail (default) — a code diff with no touched Change fails the job
#   warn — print a warning and continue
#
# This template does not push, merge, or deploy.
# Actions are pinned to the same commit SHAs as this repository's workflows.
# The token is read-only and is not left in the git credential store.

name: Retornatus

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  RETORNATUS_OMISSION: fail

jobs:
  retornatus-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Retornatus
        run: uv tool install "retornatus==1.3.0"

      - name: Doctor (Process vs Brakes)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          retornatus doctor

      - name: Wake / rebuild index
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          retornatus wake

      - name: Gate scan (active Contracts)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          retornatus ops run gate-scan

      - name: Resolve diff base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=origin/${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify touched Changes and diff gates
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mapfile -t TOUCHED < <(
            git diff --name-only "${BASE_SHA}...HEAD" -- .retornatus/changes \
              | sed -n 's|^\.retornatus/changes/\(C-[0-9][0-9]*\)/.*|\1|p' \
              | sort -u
          )
          code_changed=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              src/*|tests/*|scripts/*|templates/*|pyproject.toml|uv.lock)
                code_changed=1
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}...HEAD")

          if [ "${#TOUCHED[@]}" -eq 0 ] && [ "$code_changed" -eq 1 ]; then
            echo "Code changed but no .retornatus Change was touched (skip-by-omission)."
            if [ "${RETORNATUS_OMISSION}" = "warn" ]; then
              echo "::warning::Code changed but no Change was touched"
            else
              exit 1
            fi
          fi

          status=0
          echo "Suppression gate against ${BASE_SHA}"
          if ! retornatus gate suppressions --base "${BASE_SHA}"; then
            status=1
          fi
          if [ "${#TOUCHED[@]}" -eq 0 ]; then
            echo "No Change paths in the diff — verify and scope skipped"
            exit "$status"
          fi
          for cid in "${TOUCHED[@]}"; do
            echo "::group::verify $cid"
            if ! retornatus verify "$cid"; then
              echo "verify failed for $cid"
              status=1
            fi
            echo "::endgroup::"
            echo "::group::scope $cid"
            if ! retornatus gate scope "$cid" --base "${BASE_SHA}"; then
              echo "scope gate failed for $cid"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
