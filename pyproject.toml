[project]
name = "retornatus"
version = "1.1.1"
description = "Repo-native governance harness for AI-assisted software development."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Retornatus Contributors" }]
keywords = ["governance", "ai", "software-engineering", "harness"]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/luizssantiago92/retornatus"
Repository = "https://github.com/luizssantiago92/retornatus"
Issues = "https://github.com/luizssantiago92/retornatus/issues"

[project.scripts]
retornatus = "retornatus.cli.main:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retornatus"]

[tool.hatch.build.targets.wheel.force-include]
"src/retornatus/infrastructure/environment/hub/SKILL.md" = "retornatus/infrastructure/environment/hub/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
