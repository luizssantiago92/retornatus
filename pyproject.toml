[project]
name = "retornatus"
version = "1.3.0"
description = "Repo-native governance harness for AI-assisted software development."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luiz Santiago" }]
keywords = ["governance", "ai", "software-engineering", "harness"]
dependencies = [
    "cryptography>=42",
    "pydantic>=2.0",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/luizssantiago92/retornatus"
Repository = "https://github.com/luizssantiago92/retornatus"
Issues = "https://github.com/luizssantiago92/retornatus/issues"

[project.scripts]
retornatus = "retornatus.cli.main:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retornatus"]

[tool.hatch.build.targets.wheel.force-include]
"src/retornatus/infrastructure/environment/hub/SKILL.md" = "retornatus/infrastructure/environment/hub/SKILL.md"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.assets",
    "/.cursor",
    "/.github",
    "/.retornatus",
    "/docs",
    "/prd",
    "/scripts",
    "/templates",
    "/tests",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff==0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=retornatus --cov-report=term-missing"

[tool.coverage.run]
source = ["retornatus"]

[tool.coverage.report]
# Current suite reports 83% (6349 statements, 1087 missed). Do not lower this.
fail_under = 83
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer options are evaluated at import; B008 is the documented CLI pattern.
"src/retornatus/cli/**/*.py" = ["B008"]
# Dynamic import of the dogfood app written into a temp project.
"tests/support/host_boundary.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["retornatus"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
