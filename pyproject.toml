[project]
name = "retornatus"
version = "0.2.0"
description = "Repo-native governance harness for AI-assisted software development."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Retornatus Contributors" }]
keywords = ["governance", "ai", "software-engineering", "harness"]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
retornatus = "retornatus.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retornatus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
