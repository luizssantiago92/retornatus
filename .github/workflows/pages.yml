# GitHub Pages — Retornatus site

name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_docs_html.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate docs HTML
        run: python scripts/build_docs_html.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
