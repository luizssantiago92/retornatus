# Publish retornatus to PyPI with Trusted Publishing.
#
# Tag push: the tag must be v<package version> and the tagged commit must be on main.
# Manual dispatch: must run from main. target=pypi publishes; target=test tries TestPyPI
# and does not fail the workflow.
#
# No PyPI API tokens. The pypi environment and the trusted publisher on pypi.org
# are owner setup (see CONTRIBUTING.md). Versions already on PyPI are skipped.
#
# uv caching is off in this workflow. A poisoned Actions cache must not be
# restored into a job that can publish.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (test is optional and non-blocking)"
        required: true
        default: pypi
        type: choice
        options:
          - pypi
          - test

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Typecheck (mypy)
        run: uv run mypy

      - name: Docs HTML check
        run: uv run python scripts/build_docs_html.py --check

      - name: Tests
        run: uv run pytest -q

  package:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag commit to be on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not contained in main."
            exit 1
          fi

      - name: Require manual dispatch from main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Manual publish must run from main (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution contents
        run: uv run python scripts/check_dist_contents.py dist

      - name: Match tag, changelog, and PyPI
        id: meta
        run: uv run python scripts/publish_preflight.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/*

  publish:
    needs: package
    if: >-
      needs.package.outputs.skip != 'true' &&
      (github.event_name == 'push' || github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/retornatus/${{ needs.package.outputs.version }}/
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: dist

  publish-testpypi:
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'test'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: testpypi
      url: https://test.pypi.org/project/retornatus/${{ needs.package.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          packages-dir: dist
