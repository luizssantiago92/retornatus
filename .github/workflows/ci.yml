name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uvx ruff@0.11.0 check src tests

      - name: Typecheck (mypy)
        run: uvx --from mypy mypy src/retornatus --ignore-missing-imports

      - name: Tests
        run: uv run pytest -q
