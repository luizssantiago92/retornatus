name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Typecheck (mypy)
        run: uv run mypy

      - name: Docs HTML check
        run: uv run python scripts/build_docs_html.py --check

      - name: Tests
        run: uv run pytest -q

  governance:
    name: Retornatus gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Doctor (Process vs Brakes)
        run: uv run retornatus doctor

      - name: Wake / rebuild index
        run: uv run retornatus wake

      - name: Gate scan (active Contracts)
        run: uv run retornatus ops run gate-scan

      - name: Resolve diff base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=origin/${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify touched Changes and diff gates
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          RETORNATUS_OMISSION: fail
        run: |
          mapfile -t TOUCHED < <(
            git diff --name-only "${BASE_SHA}...HEAD" -- .retornatus/changes \
              | sed -n 's|^\.retornatus/changes/\(C-[0-9][0-9]*\)/.*|\1|p' \
              | sort -u
          )
          code_changed=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              src/*|tests/*|scripts/*|templates/*|pyproject.toml|uv.lock)
                code_changed=1
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}...HEAD")

          if [ "${#TOUCHED[@]}" -eq 0 ] && [ "$code_changed" -eq 1 ]; then
            echo "Code changed but no .retornatus Change was touched (skip-by-omission)."
            if [ "${RETORNATUS_OMISSION}" = "warn" ]; then
              echo "::warning::Code changed but no Change was touched"
            else
              exit 1
            fi
          fi

          status=0
          echo "Suppression gate against ${BASE_SHA}"
          if ! uv run retornatus gate suppressions --base "${BASE_SHA}"; then
            status=1
          fi
          if [ "${#TOUCHED[@]}" -eq 0 ]; then
            echo "No Change paths in the diff — verify and scope skipped"
            exit "$status"
          fi
          for cid in "${TOUCHED[@]}"; do
            echo "::group::verify $cid"
            if ! uv run retornatus verify "$cid"; then
              echo "verify failed for $cid"
              status=1
            fi
            echo "::endgroup::"
            echo "::group::scope $cid"
            if ! uv run retornatus gate scope "$cid" --base "${BASE_SHA}"; then
              echo "scope gate failed for $cid"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  lowest-direct:
    name: Lowest direct dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync lowest-direct dependencies
        run: uv sync --resolution lowest-direct --group dev

      - name: Tests
        run: uv run pytest -q
