name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Typecheck (mypy)
        run: uv run mypy

      - name: Docs HTML check
        run: uv run python scripts/build_docs_html.py --check

      - name: Tests
        run: uv run pytest -q

  governance:
    name: Retornatus gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Doctor (Process vs Brakes)
        run: uv run retornatus doctor

      - name: Wake / rebuild index
        run: uv run retornatus wake

      - name: Gate scan (active Contracts)
        run: uv run retornatus ops run gate-scan

      - name: Verify, diff gates, and sticky comment
        uses: ./
        with:
          version: local
          comment: "true"
          fail-on: not_satisfied

  lowest-direct:
    name: Lowest direct dependencies
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync lowest-direct dependencies
        run: uv sync --resolution lowest-direct --group dev

      - name: Tests
        run: uv run pytest -q
